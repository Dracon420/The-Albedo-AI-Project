<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>ALBEDO // TEAM</title>
  <script type="text/javascript" src="/eel.js"></script>
  <link rel="stylesheet" href="static/css/cyberdeck.css?v=314" />
  <link rel="stylesheet" href="static/css/panels.css?v=314" />
</head>
<body class="popout">
  <div id="vizRoot"></div>
  <div id="snapRoot"></div>

  <script src="static/js/event_bus_client.js?v=317"></script>
  <script src="static/js/team_viz.js?v=314"></script>
  <script src="static/js/snap.js?v=314"></script>
  <script>
    (function () {
      function whenReady() {
        if (typeof eel === "undefined" || !eel.get_event_history) {
          return setTimeout(whenReady, 100);
        }
        TeamViz.mount(document.getElementById("vizRoot"));
        Snap.attach(document.getElementById("snapRoot"));
      }
      document.addEventListener("DOMContentLoaded", whenReady);
    })();
  </script>
</body>
</html>
