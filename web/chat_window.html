<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>ALBEDO // CHAT</title>
  <link rel="icon" type="image/svg+xml" href="static/icons/icon_chat.svg?v=1" />
  <script type="text/javascript" src="/eel.js"></script>
  <link rel="stylesheet" href="static/css/cyberdeck.css?v=325" />
  <link rel="stylesheet" href="static/css/panels.css?v=324" />
</head>
<body class="popout popout--chat">
  <div id="panelRoot"></div>
  <div id="snapRoot"></div>

  <script src="static/js/event_bus_client.js?v=317"></script>
  <script src="static/js/panels/chat_panel.js?v=329"></script>
  <script src="static/js/snap.js?v=314"></script>
  <script>
    (function () {
      function whenReady() {
        if (typeof eel === "undefined" || !eel.send_chat) {
          return setTimeout(whenReady, 100);
        }
        ChatPanel.mount(document.getElementById("panelRoot"));
        Snap.attach(document.getElementById("snapRoot"));
      }
      document.addEventListener("DOMContentLoaded", whenReady);
    })();
  </script>
</body>
</html>
